<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#313338"><title>Misty · Your conversations</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/gmail.js" defer></script><script src="/chat.js" defer></script><script src="/briefings.js" defer></script><script src="/misty.js" defer></script><link rel="stylesheet" href="/misty.css"></head>
<body data-screen="inbox">
<aside class="sidebar" aria-label="Workspace navigation">
 <button class="brand rail-button active" data-page="inbox" title="Misty · All conversations" aria-label="Misty · All conversations"><span class="brand-icon">m</span><span class="rail-tooltip">Misty</span></button>
 <div class="rail-divider"></div>
 <button class="rail-button" data-platform-filter="discord" title="Discord conversations" aria-label="Discord conversations">DC</button>
 <button class="rail-button whatsapp" data-platform-filter="whatsapp" title="WhatsApp conversations" aria-label="WhatsApp conversations">WA</button>
 <div class="rail-divider"></div>
 <button class="nav rail-button" data-page="briefings" title="Summaries & events" aria-label="Summaries and events"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span class="rail-tooltip">Briefings</span></button>
 <button class="nav rail-button" data-page="people" title="People & identities" aria-label="People and identities"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span class="rail-tooltip">People</span></button>
 <div class="rail-bottom"><button class="rail-button" data-page="profile" title="User settings" aria-label="Open user settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 4 2 2v3l4 3 3-1 3 1 4-3v-3l2-2-2-4-3-1-1-3z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
</aside>
<main id="workspace-main"><header class="topbar"><div><span class="topbar-symbol">@</span><strong id="breadcrumb">Misty</strong><span class="topbar-divider"></span><span class="topbar-caption">Your conversations, together</span></div><div><span id="live-status" class="status">Connecting…</span><button id="refresh" class="icon-button" title="Check connections" aria-label="Check connections">↻</button></div></header><div id="content"><div class="loading-state" role="status"><span class="spinner"></span>Opening Misty…</div></div></main>
<div id="toast" role="status" hidden></div>
<dialog id="user-settings" aria-labelledby="settings-title"><div class="settings-layout"><aside class="user-settings-nav"><h2 id="settings-title">USER SETTINGS</h2><button class="settings-tab" data-page="profile">My profile & interests</button><button class="settings-tab" data-page="people">People & identities</button><button class="settings-tab" data-page="sync">Connections & storage</button><div class="settings-divider"></div><strong class="settings-wordmark">Misty</strong><p>Your conversations. Your context.</p><button id="settings-return" class="text-button">Return to conversations</button></aside><section id="settings-slot" aria-live="polite"></section><button id="settings-close" class="settings-close" aria-label="Close settings"><span>×</span><small>ESC</small></button></div></dialog>
<dialog id="modal" aria-label="Conversation details"><button id="close-modal" class="modal-close" aria-label="Close dialog">×</button><div id="modal-content"></div></dialog>
</body></html>
